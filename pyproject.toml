[tool.poetry]
name = "save-db-hh-vacancies-by-employers"
version = "0.1.0"
description = "Сохранение вакансий HeadHunter по заданному списку работодателей в БД"
authors = ["Maksim Lakovich <maks.lakovich@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13"
requests = "^2.32.3"
psycopg2 = "^2.9.10"
python-dotenv = "^1.0.1"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.2"
isort = "^6.0.1"
black = "^25.1.0"
mypy = "^1.15.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
